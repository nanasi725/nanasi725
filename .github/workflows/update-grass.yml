name: Generate Seasonal Snack Game

on:
  schedule:
    - cron: "0 18 * * *" # 毎日日本時間の午前3時に自動更新
  workflow_dispatch:     # 手動でいつでも実行可能

jobs:
  generate:
    permissions:
      contents: write #
    runs-on: ubuntu-latest #
    timeout-minutes: 5 #
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #

      - name: Determine seasonal colors
        id: season
        run: |
          # 現在の月を取得 (1〜12)
          MONTH=$(date +%m | sed 's/^0//')
          
          # 季節ごとに5つの草の色（カンマ区切り）とヘビの色を定義
          if [ "$MONTH" -ge 3 ] && [ "$MONTH" -le 5 ]; then
            # 春：爽やかな青緑（ocean系）
            echo "dots=#ebedf0,#8dbdff,#64a1f4,#4b91f1,#3c7dd9" >> $GITHUB_OUTPUT
            echo "snake=orange" >> $GITHUB_OUTPUT
          elif [ "$MONTH" -ge 6 ] && [ "$MONTH" -le 8 ]; then
            # 夏：いつもの鮮やかな緑 (GitHub標準)
            echo "dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39" >> $GITHUB_OUTPUT
            echo "snake=#4b91f1" >> $GITHUB_OUTPUT
          elif [ "$MONTH" -ge 9 ] && [ "$MONTH" -le 11 ]; then
            # 秋：ハロウィン・紅葉のオレンジ・ブラウニー系
            echo "dots=#ebedf0,#ffee58,#fcc01e,#f27e2b,#af3812" >> $GITHUB_OUTPUT
            echo "snake=#b388ff" >> $GITHUB_OUTPUT
          else
            # 冬：氷のような寒色系・ホワイトアクア
            echo "dots=#ebedf0,#e0f7fa,#b2ebf2,#4dd0e1,#00bcd4" >> $GITHUB_OUTPUT
            echo "snake=#cfd8dc" >> $GITHUB_OUTPUT
          fi

      # アニメーションSVGの生成
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3 #
        with:
          github_user_name: ${{ github.repository_owner }} #
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=${{ steps.season.outputs.snake }}&color_dots=${{ steps.season.outputs.dots }}
            dist/github-contribution-grid-snake-dark.svg?color_snake=${{ steps.season.outputs.snake }}&color_dots=${{ steps.season.outputs.dots }}&color_mode=dark

      # 生成された画像をリポジトリ（outputブランチ）にプッシュ
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4 #
        with:
          target_branch: output #
          build_dir: dist #
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #
