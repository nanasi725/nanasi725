name: Generate Seasonal Snack Game

on:
  schedule:
    - cron: "0 18 * * *" # 毎日日本時間の午前3時に自動更新
  workflow_dispatch:     # 手動でいつでも実行可能

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine seasonal palette
        id: season
        run: |
          # 現在の月を取得 (1〜12)
          MONTH=$(date +%m | sed 's/^0//')
          
          # 月に応じて snk が対応しているカラーパレットを決定
          # ※ github-light/dark 以外のカスタム色を設定
          if [ "$MONTH" -ge 3 ] && [ "$MONTH" -le 5 ]; then
            echo "palette=ocean" # 春：爽やかな青緑系（桜の代わりに変化を付ける）
          elif [ "$MONTH" -ge 6 ] && [ "$MONTH" -le 8 ]; then
            echo "palette=github" # 夏：いつもの鮮やかな緑
          elif [ "$MONTH" -ge 9 ] && [ "$MONTH" -le 11 ]; then
            echo "palette=halloween" # 秋：ハロウィン・紅葉のオレンジ系
          else
            echo "palette=ice" # 冬：氷のような寒色系
          fi >> $GITHUB_OUTPUT

      # アニメーションSVGの生成
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=${{ steps.season.outputs.palette }}
            dist/github-contribution-grid-snake-dark.svg?palette=${{ steps.season.outputs.palette }}&color_mode=dark

      # 生成された画像をリポジトリ（outputブランチ）にプッシュ
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
